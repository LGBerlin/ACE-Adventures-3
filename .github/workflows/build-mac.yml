name: Build ACE Adventures 3 Mac App
on:
  workflow_dispatch:
    inputs:
      release_tier:
        description: 'Preview for packaging tests; stable requires approved artwork'
        type: choice
        options: [preview, stable]
        default: preview
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify complete illustrated application
        run: python release_preflight.py
      - name: Install packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0 certifi psutil pillow
      - name: Test and compile
        run: |
          python -m compileall -q .
          python -m unittest discover -v
      - name: Verify approved visual library coverage and provenance (stable only)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tier == 'stable'
        run: python verify_release_assets.py 'assets/approved sprites'
      - name: Mark non-release build
        if: github.event_name != 'workflow_dispatch' || inputs.release_tier != 'stable'
        run: echo 'DEVELOPMENT PREVIEW ONLY — approved sprite asset pack and stable acceptance are not yet complete.'
      - name: Build native Mac app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --name 'ACE Adventures 3' \
            --osx-bundle-identifier 'game.aceadventures.three' \
            app.py
      - name: Verify packaged app structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import plistlib
          bundle=Path('dist/ACE Adventures 3.app')
          info=plistlib.loads((bundle/'Contents/Info.plist').read_bytes())
          exe=bundle/'Contents/MacOS'/info['CFBundleExecutable']
          assert exe.is_file() and exe.stat().st_size>100000,exe
          assert (bundle/'Contents/Frameworks').is_dir() or (bundle/'Contents/_internal').is_dir(), 'Missing PyInstaller runtime'
          print('Verified native executable, plist, and bundled runtime.')
          PY
      - name: Verify frozen launcher
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,time
          exe=Path('dist/ACE Adventures 3.app/Contents/MacOS/ACE Adventures 3')
          assert exe.is_file()
          arches=subprocess.check_output(['lipo','-archs',str(exe)],text=True)
          assert 'arm64' in arches,arches
          proc=subprocess.Popen([str(exe.resolve())],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          try:
              time.sleep(8)
              if proc.poll() is not None:
                  stdout,stderr=proc.communicate(timeout=5)
                  raise RuntimeError(f'App quit: {proc.returncode}\n{stdout.decode(errors="replace")}\n{stderr.decode(errors="replace")}')
          finally:
              proc.terminate()
              try: proc.communicate(timeout=5)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  proc.communicate()
          PY
      - name: Check packaged-app idle resource budget
        run: python mac_resource_smoke.py
      - name: Package artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'dist/ACE Adventures 3.app' 'ACE Adventures 3 Mac App.zip'
          shasum -a 256 'ACE Adventures 3 Mac App.zip' > 'ACE Adventures 3 Mac App.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: ACE Adventures 3 Mac ${{ github.event_name == 'workflow_dispatch' && inputs.release_tier == 'stable' && 'Stable Candidate' || 'Development Preview' }}
          path: |
            ACE Adventures 3 Mac App.zip
            ACE Adventures 3 Mac App.sha256
          if-no-files-found: error
