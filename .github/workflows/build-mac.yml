name: Build ACE Adventures 3 Mac App
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify complete illustrated application
        run: python release_preflight.py
      - name: Install packager
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0 certifi
      - name: Test and compile
        run: |
          python -m compileall -q .
          python -m unittest discover -v
      - name: Verify public content update channel
        run: |
          python - <<'PY'
          import tempfile,addon_updates,update_addons
          with tempfile.TemporaryDirectory() as temp:
              result=addon_updates.check_and_install(temp)
              assert result==('updated','1.0.0'),result
              content=update_addons.active_asset(temp,'stories/hollow-bell.json')
              assert content is not None and content.is_file()
              assert addon_updates.check_and_install(temp)==('current','1.0.0')
              print('Verified HTTPS, SHA-256, install, activation and idempotent update.')
          PY
      - name: Build native Mac app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --name 'ACE Adventures 3' \
            --osx-bundle-identifier 'game.aceadventures.three' \
            app.py
      - name: Validate bundled modules
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('app','game','story','dungeon_master','ai','ai_connections','art','update_addons'):
              p=Path('dist/ACE Adventures 3')/(name+'.py')
          print('Source tests passed. PyInstaller dependency discovery completed.')
          PY
      - name: Verify frozen launcher
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,time
          exe=Path('dist/ACE Adventures 3.app/Contents/MacOS/ACE Adventures 3')
          assert exe.is_file()
          arches=subprocess.check_output(['lipo','-archs',str(exe)],text=True)
          assert 'arm64' in arches,arches
          proc=subprocess.Popen([str(exe.resolve())],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          try:
              time.sleep(8)
              if proc.poll() is not None:
                  stdout,stderr=proc.communicate(timeout=5)
                  raise RuntimeError(f'App quit: {proc.returncode}\n{stdout.decode(errors="replace")}\n{stderr.decode(errors="replace")}')
          finally:
              proc.terminate()
              try: proc.communicate(timeout=5)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  proc.communicate()
          PY
      - name: Package artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'dist/ACE Adventures 3.app' 'ACE Adventures 3 Mac App.zip'
          shasum -a 256 'ACE Adventures 3 Mac App.zip' > 'ACE Adventures 3 Mac App.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: ACE Adventures 3 Mac App
          path: |
            ACE Adventures 3 Mac App.zip
            ACE Adventures 3 Mac App.sha256
          if-no-files-found: error
